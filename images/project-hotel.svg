  <text x="482" y="274" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Employee Shift Manager</text>

  <text x="404" y="318" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10b981">✓ Java JDBC &amp; MySQL Synced</text>
