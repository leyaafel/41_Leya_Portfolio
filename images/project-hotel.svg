  <rect x="408" y="54" width="168" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="422" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Database Operations</text>
  <text x="422" y="106" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">CRUD 0-Delay</text>

