    <text x="110" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">R-202</text>
    <text x="110" y="78" font-family="'Inter', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Occupied</text>

    <rect x="152" y="46" width="68" height="38" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="186" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">R-203</text>
    <text x="186" y="78" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Available</text>

    <rect x="228" y="46" width="68" height="38" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="262" y="64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">R-204</text>
    <text x="262" y="78" font-family="'Inter', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Occupied</text>

