  <rect x="24" y="54" width="168" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="38" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Occupancy Rate</text>
  <text x="38" y="106" font-family="'Inter', sans-serif" font-size="22" font-weight="bold" fill="#f59e0b">87.5% <tspan font-size="12" font-weight="normal" fill="#38bdf8">(42/48 Rms)</tspan></text>

  <rect x="216" y="54" width="168" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="230" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Active Check-Ins</text>
