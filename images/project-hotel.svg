    <rect x="0" y="92" width="144" height="38" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="72" y="110" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">Executive Suite 301 ★</text>
    <text x="72" y="124" font-family="'Inter', sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">VIP Reserved</text>

    <rect x="152" y="92" width="144" height="38" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="224" y="110" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Presidential Suite 302 ★</text>
    <text x="224" y="124" font-family="'Inter', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Checked In</text>
