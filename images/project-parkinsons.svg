<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="rocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="600" height="360" rx="12" fill="url(#pdBg)"/>

  <!-- Title bar -->
  <rect width="600" height="38" rx="12" fill="#030712"/>
  <rect y="26" width="600" height="12" fill="#030712"/>
  <circle cx="24" cy="19" r="6" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="19" r="6" fill="#10b981"/>
  <text x="110" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Parkinson's Disease Detection · Acoustic Voice ML Pipeline (CNN + XGBoost)</text>

  <!-- Metric Badges -->
  <rect x="24" y="54" width="168" height="74" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="38" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#9ca3af">ROC-AUC Score</text>
  <text x="38" y="106" font-family="'Inter', sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">94.7% <tspan font-size="12" font-weight="normal" fill="#10b981">★ Peak</tspan></text>

  <rect x="216" y="54" width="168" height="74" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="230" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#9ca3af">Diagnostic Recall</text>
  <text x="230" y="106" font-family="'Inter', sans-serif" font-size="22" font-weight="bold" fill="#10b981">89.4% <tspan font-size="11" font-weight="normal" fill="#9ca3af">(Min False -)</tspan></text>

  <rect x="408" y="54" width="168" height="74" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="422" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#9ca3af">Classifier Model</text>
  <text x="422" y="106" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#f59e0b">XGBoost <tspan font-size="11" font-weight="normal" fill="#9ca3af">(5-Fold)</tspan></text>

  <!-- Left: Acoustic Waveform & Spectrogram -->
  <rect x="24" y="146" width="340" height="188" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="40" y="172" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f3f4f6">Voice Acoustic Features (MFCC, Jitter, Shimmer)</text>
  
  <!-- Waveform grid -->
  <line x1="40" y1="210" x2="344" y2="210" stroke="#1f2937" stroke-width="1"/>
  <line x1="40" y1="250" x2="344" y2="250" stroke="#1f2937" stroke-width="1"/>
  
  <!-- Audio Waveform -->
  <path d="M40 240 Q60 210 75 250 T110 200 T145 270 T175 185 T205 285 T235 220 T265 260 T300 230 T340 240" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- MFCC Bar Spectrogram representation -->
  <rect x="44" y="278" width="18" height="36" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="68" y="265" width="18" height="49" rx="2" fill="#818cf8" opacity="0.85"/>
  <rect x="92" y="284" width="18" height="30" rx="2" fill="#ec4899" opacity="0.9"/>
  <rect x="116" y="255" width="18" height="59" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="140" y="270" width="18" height="44" rx="2" fill="#818cf8" opacity="0.8"/>
  <rect x="164" y="260" width="18" height="54" rx="2" fill="#10b981" opacity="0.85"/>
  <rect x="188" y="280" width="18" height="34" rx="2" fill="#ec4899" opacity="0.8"/>
  <rect x="212" y="250" width="18" height="64" rx="2" fill="#38bdf8" opacity="0.9"/>
  <rect x="236" y="272" width="18" height="42" rx="2" fill="#818cf8" opacity="0.85"/>
  <rect x="260" y="285" width="18" height="29" rx="2" fill="#f59e0b" opacity="0.85"/>
  <rect x="284" y="262" width="18" height="52" rx="2" fill="#10b981" opacity="0.8"/>
  <rect x="308" y="275" width="18" height="39" rx="2" fill="#38bdf8" opacity="0.8"/>

  <!-- Right: Benchmark Comparison Chart -->
  <rect x="388" y="146" width="188" height="188" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="404" y="172" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f3f4f6">Classifier Benchmarks</text>
  
  <!-- Bar 1: XGBoost (94.7%) -->
  <text x="404" y="200" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">XGBoost (Best)</text>
  <rect x="404" y="206" width="156" height="12" rx="4" fill="#1f2937"/>
  <rect x="404" y="206" width="148" height="12" rx="4" fill="url(#rocGrad)"/>
  <text x="404" y="230" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9ca3af">94.7% ROC / 89.4% Recall</text>

  <!-- Bar 2: Random Forest (91.4%) -->
  <text x="404" y="252" font-family="'Inter', sans-serif" font-size="11" fill="#d1d5db">Random Forest</text>
  <rect x="404" y="258" width="156" height="10" rx="4" fill="#1f2937"/>
  <rect x="404" y="258" width="138" height="10" rx="4" fill="#818cf8"/>

  <!-- Bar 3: SVM (88.2%) -->
  <text x="404" y="286" font-family="'Inter', sans-serif" font-size="11" fill="#d1d5db">SVM Classifier</text>
  <rect x="404" y="292" width="156" height="10" rx="4" fill="#1f2937"/>
  <rect x="404" y="292" width="128" height="10" rx="4" fill="#64748b"/>
  
  <text x="404" y="322" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10b981">✓ Minimized false negatives</text>
</svg>
