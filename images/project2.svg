<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.4)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.0)" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="600" height="360" rx="12" fill="url(#p2Bg)"/>

  <!-- Window Header -->
  <rect width="600" height="38" rx="12" fill="#000000"/>
  <rect y="26" width="600" height="12" fill="#000000"/>
  <circle cx="24" cy="19" r="6" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="19" r="6" fill="#10b981"/>
  <text x="120" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">NeuroPulse · AI Inference Engine &amp; Analytics Dashboard</text>

  <!-- Metric Stat Cards -->
  <rect x="24" y="56" width="168" height="74" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="40" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#a1a1aa">Real-time Throughput</text>
  <text x="40" y="106" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">98.4k <tspan font-size="12" font-weight="normal" fill="#10b981">+18.2% ↑</tspan></text>

  <rect x="216" y="56" width="168" height="74" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="232" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#a1a1aa">Avg Latency (P99)</text>
  <text x="232" y="106" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">14.2 ms <tspan font-size="12" font-weight="normal" fill="#10b981">-4.1ms ↓</tspan></text>

  <rect x="408" y="56" width="168" height="74" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="424" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#a1a1aa">Model Accuracy</text>
  <text x="424" y="106" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">99.28% <tspan font-size="12" font-weight="normal" fill="#8b5cf6">★ F1</tspan></text>

  <!-- Large Chart Area -->
  <rect x="24" y="148" width="360" height="184" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="44" y="174" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Inference Volume vs Token Efficiency</text>

  <!-- Chart Grid Lines -->
  <line x1="44" y1="200" x2="360" y2="200" stroke="#27272a" stroke-width="1"/>
  <line x1="44" y1="240" x2="360" y2="240" stroke="#27272a" stroke-width="1"/>
  <line x1="44" y1="280" x2="360" y2="280" stroke="#27272a" stroke-width="1"/>

  <!-- Chart Area fill -->
  <path d="M44 285 Q100 240 140 260 T220 210 T300 190 T360 170 L360 300 L44 300 Z" fill="url(#areaGrad)"/>
  <!-- Chart Line -->
  <path d="M44 285 Q100 240 140 260 T220 210 T300 190 T360 170" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Data point dots -->
  <circle cx="140" cy="260" r="4" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="220" cy="210" r="4" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="300" cy="190" r="4" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

  <!-- Neural weights / circular gauge -->
  <rect x="408" y="148" width="168" height="184" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="424" y="174" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Confidence Score</text>
  <circle cx="492" cy="240" r="50" fill="none" stroke="#27272a" stroke-width="12"/>
  <circle cx="492" cy="240" r="50" fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-dasharray="260" stroke-dashoffset="60" stroke-linecap="round"/>
  <text x="492" y="246" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">94.8%</text>
  <text x="492" y="308" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981" text-anchor="middle">● Optimal Performance</text>
</svg>
