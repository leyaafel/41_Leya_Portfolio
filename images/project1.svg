<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Window Container -->
  <rect width="600" height="360" rx="12" fill="url(#p1Bg)"/>

  <!-- Browser Header Bar -->
  <rect width="600" height="38" rx="12" fill="#090d16"/>
  <rect y="26" width="600" height="12" fill="#090d16"/>
  <circle cx="24" cy="19" r="6" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="19" r="6" fill="#10b981"/>
  <rect x="100" y="9" width="340" height="20" rx="6" fill="#1e293b"/>
  <text x="120" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">https://cloudstore-ecommerce.dev/shop</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="130" height="322" fill="#0f172a"/>
  <rect x="18" y="58" width="94" height="18" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
  <rect x="18" y="90" width="80" height="12" rx="3" fill="#334155"/>
  <rect x="18" y="112" width="70" height="12" rx="3" fill="#334155"/>
  <rect x="18" y="134" width="85" height="12" rx="3" fill="#334155"/>
  <rect x="18" y="156" width="60" height="12" rx="3" fill="#334155"/>

  <!-- Main Content Dashboard -->
  <!-- Top Banner -->
  <rect x="150" y="56" width="426" height="74" rx="8" fill="url(#cardGrad)" filter="url(#pShadow)"/>
  <text x="175" y="88" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Summer Tech Clearance ⚡</text>
  <text x="175" y="110" font-family="'Inter', sans-serif" font-size="12" fill="#e0f2fe">Up to 40% off on developer workstations &amp; accessories</text>

  <!-- Product Card 1 -->
  <rect x="150" y="148" width="132" height="184" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="162" y="160" width="108" height="80" rx="6" fill="#0f172a"/>
  <!-- Laptop icon -->
  <rect x="186" y="180" width="60" height="36" rx="3" fill="#38bdf8" opacity="0.8"/>
  <rect x="180" y="218" width="72" height="6" rx="2" fill="#94a3b8"/>
  <text x="162" y="258" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">UltraBook Pro</text>
  <text x="162" y="276" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38bdf8">$1,299</text>
  <rect x="162" y="292" width="108" height="26" rx="4" fill="#2563eb"/>
  <text x="188" y="309" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Add to Cart</text>

  <!-- Product Card 2 -->
  <rect x="296" y="148" width="132" height="184" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="308" y="160" width="108" height="80" rx="6" fill="#0f172a"/>
  <!-- Mechanical keyboard icon -->
  <rect x="326" y="190" width="72" height="24" rx="3" fill="#818cf8"/>
  <circle cx="338" cy="202" r="3" fill="#ffffff"/>
  <circle cx="350" cy="202" r="3" fill="#ffffff"/>
  <circle cx="362" cy="202" r="3" fill="#ffffff"/>
  <circle cx="374" cy="202" r="3" fill="#ffffff"/>
  <text x="308" y="258" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Mech Keyboard</text>
  <text x="308" y="276" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38bdf8">$149</text>
  <rect x="308" y="292" width="108" height="26" rx="4" fill="#2563eb"/>
  <text x="334" y="309" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Add to Cart</text>

  <!-- Mini Cart / Checkout preview -->
  <rect x="444" y="148" width="132" height="184" rx="8" fill="#111827" stroke="#10b981" stroke-width="1"/>
  <text x="456" y="172" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#10b981">✓ Cart Summary</text>
  <text x="456" y="196" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Items: 2</text>
  <text x="456" y="216" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Shipping: FREE</text>
  <line x1="456" y1="230" x2="564" y2="230" stroke="#374151" stroke-width="1"/>
  <text x="456" y="252" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Total: $1,448</text>
  <rect x="456" y="280" width="108" height="34" rx="6" fill="url(#btnGrad)"/>
  <text x="478" y="302" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Checkout →</text>
</svg>
