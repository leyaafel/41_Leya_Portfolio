<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="whBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="600" height="360" rx="12" fill="url(#whBg)"/>

  <!-- Window Header -->
  <rect width="600" height="38" rx="12" fill="#021c1c"/>
  <rect y="26" width="600" height="12" fill="#021c1c"/>
  <circle cx="24" cy="19" r="6" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="19" r="6" fill="#10b981"/>
  <text x="110" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#99f6e4">Wheelabled · Dubai Wheelchair-Accessible Navigation &amp; Venue Finder</text>

  <!-- Top Stat Cards -->
  <rect x="24" y="54" width="168" height="74" rx="8" fill="#115e59" stroke="#14b8a6" stroke-width="1"/>
  <text x="38" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#ccfbf1">Verified Venues (Dubai)</text>
  <text x="38" y="106" font-family="'Inter', sans-serif" font-size="22" font-weight="bold" fill="#ffffff">350+ <tspan font-size="12" font-weight="normal" fill="#5eead4">Parks &amp; Cafes</tspan></text>

  <rect x="216" y="54" width="168" height="74" rx="8" fill="#115e59" stroke="#14b8a6" stroke-width="1"/>
  <text x="230" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#ccfbf1">Accessibility Index</text>
  <text x="230" y="106" font-family="'Inter', sans-serif" font-size="22" font-weight="bold" fill="#ffffff">100% <tspan font-size="12" font-weight="normal" fill="#5eead4">Ramp Verified</tspan></text>

  <rect x="408" y="54" width="168" height="74" rx="8" fill="#115e59" stroke="#14b8a6" stroke-width="1"/>
  <text x="422" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#ccfbf1">Search Latency</text>
  <text x="422" y="106" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">&lt; 50ms <tspan font-size="11" font-weight="normal" fill="#ccfbf1">(MySQL)</tspan></text>

  <!-- Left: Dubai Map & Accessibility Pins -->
  <rect x="24" y="146" width="340" height="188" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
  <text x="40" y="172" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f0fdfa">GPS Interactive Map (Dubai Metro &amp; Downtown)</text>

  <!-- Grid streets -->
  <line x1="40" y1="210" x2="344" y2="210" stroke="#134e4a" stroke-width="2"/>
  <line x1="40" y1="260" x2="344" y2="260" stroke="#134e4a" stroke-width="2"/>
  <line x1="120" y1="180" x2="120" y2="320" stroke="#134e4a" stroke-width="2"/>
  <line x1="220" y1="180" x2="220" y2="320" stroke="#134e4a" stroke-width="2"/>

  <!-- Wheelchair Friendly Venue Pins -->
  <g transform="translate(130, 220)">
    <circle cx="0" cy="0" r="15" fill="rgba(45, 212, 191, 0.25)"/>
    <circle cx="0" cy="0" r="7" fill="#2dd4bf"/>
    <!-- Wheelchair icon hint -->
    <text x="14" y="4" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Zabeel Park (Ramp ✓)</text>
  </g>

  <g transform="translate(230, 275)">
    <circle cx="0" cy="0" r="15" fill="rgba(45, 212, 191, 0.25)"/>
    <circle cx="0" cy="0" r="7" fill="#2dd4bf"/>
    <text x="14" y="4" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Dubai Mall (Elevator ✓)</text>
  </g>

  <!-- Right: Location Details & Filter -->
  <rect x="388" y="146" width="188" height="188" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
  <text x="404" y="172" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f0fdfa">Accessibility Filters</text>

  <rect x="404" y="188" width="156" height="26" rx="4" fill="#0d9488"/>
  <text x="482" y="205" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">♿ Wheelchair Ramps Only</text>

  <rect x="404" y="220" width="156" height="26" rx="4" fill="#134e4a" stroke="#14b8a6" stroke-width="1"/>
  <text x="482" y="237" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#ccfbf1" text-anchor="middle">🛗 Wide Elevators</text>

  <rect x="404" y="252" width="156" height="26" rx="4" fill="#134e4a" stroke="#14b8a6" stroke-width="1"/>
  <text x="482" y="269" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#ccfbf1" text-anchor="middle">🅿️ Reserved Disability Parking</text>

  <text x="404" y="318" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#5eead4">✓ Designed for Inclusivity</text>
</svg>
